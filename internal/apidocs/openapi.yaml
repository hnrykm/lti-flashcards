openapi: 3.1.0
info:
  title: LTI Flashcards API
  version: 0.1.0
  description: |
    Decks and cards for one course. Every request needs the session token
    issued at the end of an LTI launch; the course comes from that token, so
    a deck or card in another course is a 404. Reads are open to any course
    member; writes need an instructor.

    For local testing without a launch: `go run ./cmd/devtoken -instructor`
    (with the same SESSION_SECRET as the API), then click Authorize.
servers:
  - url: /api
security:
  - session: []

tags:
  - name: health
  - name: decks
  - name: cards

paths:
  /health:
    get:
      tags: [health]
      summary: Check that the API and database are up
      operationId: getHealth
      security: []
      responses:
        "200":
          description: API and database are reachable
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        "503":
          description: Database is unreachable

  /me:
    get:
      tags: [health]
      summary: The session from the current token
      operationId: getMe
      responses:
        "200":
          description: Who the token belongs to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /decks:
    get:
      tags: [decks]
      summary: List decks in the course
      operationId: listDecks
      responses:
        "200":
          description: Decks in the course
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deck"
        "401":
          $ref: "#/components/responses/Unauthorized"


    post:
      tags: [decks]
      summary: Create a deck
      operationId: createDeck
      requestBody:
        $ref: "#/components/requestBodies/DeckRequest"
      responses:
        "201":
          description: Deck created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


  /decks/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [decks]
      summary: Get one deck
      operationId: getDeck
      responses:
        "200":
          description: The deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [decks]
      summary: Rename a deck
      operationId: updateDeck
      requestBody:
        $ref: "#/components/requestBodies/DeckRequest"
      responses:
        "200":
          description: Deck updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


    delete:
      tags: [decks]
      summary: Delete a deck and all of its cards
      operationId: deleteDeck
      responses:
        "204":
          description: Deck deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


  /decks/{id}/cards:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [cards]
      summary: List cards in a deck
      operationId: listCards
      responses:
        "200":
          description: Cards in the deck
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"


    post:
      tags: [cards]
      summary: Add a card to a deck
      operationId: createCard
      requestBody:
        $ref: "#/components/requestBodies/CardRequest"
      responses:
        "201":
          description: Card created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


  /cards/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      tags: [cards]
      summary: Edit a card
      operationId: updateCard
      requestBody:
        $ref: "#/components/requestBodies/CardRequest"
      responses:
        "200":
          description: Card updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


    delete:
      tags: [cards]
      summary: Delete a card
      operationId: deleteCard
      responses:
        "204":
          description: Card deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session token from /lti/launch (or cmd/devtoken)

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  requestBodies:
    DeckRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DeckRequest"
    CardRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CardRequest"

  responses:
    BadRequest:
      description: Invalid JSON body, failed validation, or a non-numeric id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid or expired session token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Students can read but not change decks or cards
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such deck or card in this course
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Deck:
      type: object
      required: [id, course_id, name, created_at]
      properties:
        id:
          type: integer
          format: int64
        course_id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 100
        created_at:
          type: string
          format: date-time
    Card:
      type: object
      required: [id, deck_id, front, back, created_at]
      properties:
        id:
          type: integer
          format: int64
        deck_id:
          type: integer
          format: int64
        front:
          type: string
          minLength: 1
          maxLength: 1000
        back:
          type: string
          minLength: 1
          maxLength: 1000
        created_at:
          type: string
          format: date-time
    DeckRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Trimmed; 1–100 characters after trimming
          minLength: 1
          maxLength: 100
          example: Chapter 3 Vocab
    CardRequest:
      type: object
      required: [front, back]
      properties:
        front:
          type: string
          description: Trimmed; 1–1000 characters after trimming
          minLength: 1
          maxLength: 1000
          example: Powerhouse of the cell?
        back:
          type: string
          description: Trimmed; 1–1000 characters after trimming
          minLength: 1
          maxLength: 1000
          example: Mitochondria
    Session:
      type: object
      properties:
        course_id:
          type: integer
          format: int64
        sub:
          type: string
          description: LMS user id
        name:
          type: string
        instructor:
          type: boolean
        iat:
          type: integer
        exp:
          type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: name is required
