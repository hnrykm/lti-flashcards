services:
  # The Go API + the built Angular app. http://localhost:3000
  app:
    build: .
    environment:
      DATABASE_URL: postgres://flashcards:flashcards@db:5432/flashcards
      # Signs session tokens. Dev default only; set SESSION_SECRET in .env for anything real.
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-0123456789}
      PORT: "3000"
      # Logs what Moodle sends and what the tool sends back during a launch. Dev only.
      LTI_DEBUG: "1"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: flashcards
      POSTGRES_PASSWORD: flashcards
      POSTGRES_DB: flashcards
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./db/migrations/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashcards -d flashcards"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local Moodle LMS for testing LTI 1.3 launches. http://moodle:8080
  # "moodle" must resolve to 127.0.0.1 on your machine (add "127.0.0.1 moodle" to
  # /etc/hosts), so the browser and the app container use the same Moodle URL:
  # the app fetches Moodle's signing keys from http://moodle:8080 on the Docker network.
  moodle-db:
    image: postgres:17
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
      POSTGRES_DB: moodle
    volumes:
      - moodle-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 5s
      timeout: 3s
      retries: 10

  moodle:
    image: erseco/alpine-moodle:v5.3.1
    environment:
      SITE_URL: http://moodle:8080
      DB_TYPE: pgsql
      DB_HOST: moodle-db
      DB_PORT: 5432
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASS: moodle
      DB_PREFIX: mdl_
      MOODLE_SITENAME: FlashcardsDev
      MOODLE_EMAIL: admin@example.com
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: Admin123!
    ports:
      - "8080:8080"
    volumes:
      - moodledata:/var/www/moodledata
      - moodlehtml:/var/www/html
    depends_on:
      moodle-db:
        condition: service_healthy

volumes:
  pgdata:
  moodle-pgdata:
  moodledata:
  moodlehtml:
